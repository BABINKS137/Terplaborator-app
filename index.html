<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>TerpLaborator 🧪</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <img
                src="logo.png"
                alt="TerpLaborator"
                class="logo"
            >

            <h1>TerpLaborator 🧪</h1>

            <p class="subtitle">CATALOGUE</p>

        </header>


        <!-- PRODUITS -->
        <main class="products">

            <!-- AMNESIA -->
            <article class="product-card">

                <div class="video-container">
                    <video
                        controls
                        playsinline
                        preload="metadata"
                        poster=""
                    >
                        <source
                            src="videos/amnesia.mp4"
                            type="video/mp4"
                        >
                        Votre téléphone ne supporte pas cette vidéo.
                    </video>
                </div>

                <div class="product-info">
                    <h2>Amnesia 🍁</h2>
                </div>

            </article>


            <!-- CALI RAINBOW -->

                <div class="video-container">

                <div class="product-info">
                    <h2>Cali Rainbow 🌈</h2>

                        Votre téléphone ne supporte pas cette vidéo.
                    </video>
                </div>

                <div class="product-info">
                    <h2>Cali USA 🇺🇸</h2>

            <!-- 90U -->
            <article class="product-card">

                <div class="video-container">
                    <video
                        controls

                <div class="video-container">
                    <video
                        controls

                    >

                    </video>
                </div>

                <div class="product-info">

        </main>


        <!-- FOOTER -->
        <footer>
            <p>TerpLaborator 🧪</p>

    <script src="script.js"></script>

</body>
</html>
